<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Even or Odd</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Even Or Odd</h1>
      <button class="btn again">Again!</button>
      <div class="result">Guess if the random number is even or odd</div>
    </header>
    <main>
      <section class="top">
        <button class="btn even">Even</button>
        <button class="btn odd">Odd</button>
      </section>
      <section class="bottom">
        <p class="message">Start guessing...</p>
        <p class="label-score">💯 Score: <span class="score">0</span></p>
        <p class="label-highscore">🥇 Highscore: <span class="highscore">0</span></p>
      </section>
    </main>
    <script src="sandbox.js"></script>
  </body>
</html>
